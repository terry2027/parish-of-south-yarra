<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Outer Glow/Ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.6"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-dasharray="3, 3" opacity="0.8"/>

  <!-- Open Book of Scriptures (Base) -->
  <g id="holy-scriptures" transform="translate(0, 5)">
    <!-- Book Back/Shadow -->
    <path d="M 24 62 Q 37 57 50 63 Q 63 57 76 62 L 76 65 Q 63 60 50 66 Q 37 60 24 65 Z" fill="#6A1A2A" />
    
    <!-- Book Leaves Left -->
    <path d="M 22 58 Q 36 53 50 59 L 50 64 Q 36 58 22 63 Z" fill="#EADCC9" />
    <path d="M 23 59 Q 36 54 50 60 L 50 65 Q 36 59 23 64 Z" fill="#F4EADB" />
    <!-- Book Leaves Right -->
    <path d="M 78 58 Q 64 53 50 59 L 50 64 Q 64 58 78 63 Z" fill="#EADCC9" />
    <path d="M 77 59 Q 64 54 50 60 L 50 65 Q 64 59 77 64 Z" fill="#F4EADB" />
    
    <!-- Red Silk Bookmark -->
    <path d="M 48 59 Q 50 63 49 71 L 52 71 Q 51 63 50 59 Z" fill="#8B263E" />
    
    <!-- Gold Cover Edge -->
    <path d="M 21 63 Q 35.5 58 50 64 Q 64.5 58 79 63" fill="none" stroke="#D4AF37" stroke-width="1" />
  </g>

  <!-- The Heart -->
  <g id="heart" transform="translate(0, -2)">
    <!-- Heart Shadow -->
    <path d="M 50 53 C 40 43 32 30 50 17 C 68 30 60 43 50 53 Z" fill="#6A1A2A" opacity="0.3" transform="translate(1, 1)" />
    
    <!-- Heart Body (Deep Burgundy Gradient) -->
    <defs>
      <radialGradient id="heartGrad" cx="45%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#A8324D" />
        <stop offset="70%" stop-color="#8B263E" />
        <stop offset="100%" stop-color="#541220" />
      </radialGradient>
    </defs>
    <path d="M 50 53 C 40 43 32 30 50 17 C 68 30 60 43 50 53 Z" fill="url(#heartGrad)" stroke="#6A1A2A" stroke-width="0.75" />
    
    <!-- Heart Highlight/Gloss -->
    <path d="M 38 31 C 36 37 38 41 42 45 C 40 43 38 38 39 33 C 40 28 44 24 49 20 C 44 22 40 26 38 31 Z" fill="#FDFBF7" opacity="0.25" />
  </g>

  <!-- Golden Arrow (Piercing the Heart) -->
  <g id="arrow">
    <defs>
      <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#B8860B" />
        <stop offset="50%" stop-color="#D4AF37" />
        <stop offset="100%" stop-color="#FFF8DC" />
      </linearGradient>
    </defs>
    <!-- Arrow Shaft (Entering back right, exiting front left) -->
    <!-- Back Shaft -->
    <line x1="72" y1="20" x2="60" y2="30" stroke="url(#arrowGrad)" stroke-width="2" stroke-linecap="round" />
    <!-- Feather Fletching -->
    <path d="M 72 20 L 78 12 L 74 11 L 69 17 Z" fill="#D4AF37" />
    <path d="M 71 21 L 79 17 L 78 15 L 69 20 Z" fill="#B8860B" />
    
    <!-- Front Shaft & Arrowhead -->
    <line x1="42" y1="45" x2="28" y2="57" stroke="url(#arrowGrad)" stroke-width="2" stroke-linecap="round" />
    <!-- Arrowhead -->
    <polygon points="28,57 26,50 33,52" fill="url(#arrowGrad)" />
  </g>

  <!-- Sacred Flames (Rising from top of heart) -->
  <g id="flames" transform="translate(0, -2)">
    <defs>
      <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#8B263E" stop-opacity="0.9" />
        <stop offset="30%" stop-color="#E25822" />
        <stop offset="70%" stop-color="#F3B05C" />
        <stop offset="100%" stop-color="#FFF8DC" stop-opacity="0" />
      </linearGradient>
    </defs>
    <!-- Center Flame -->
    <path d="M 50 18 C 47 14 47 8 50 2 C 53 8 53 14 50 18 Z" fill="url(#flameGrad)" />
    <!-- Left Flame -->
    <path d="M 46 19 C 41 16 43 9 47 5 C 44 10 44 14 46 19 Z" fill="url(#flameGrad)" />
    <!-- Right Flame -->
    <path d="M 54 19 C 59 16 57 9 53 5 C 56 10 56 14 54 19 Z" fill="url(#flameGrad)" />
    
    <!-- Fire Sparkles -->
    <circle cx="50" cy="5" r="0.75" fill="#FFF8DC" opacity="0.8" />
    <circle cx="45" cy="8" r="0.5" fill="#F3B05C" opacity="0.6" />
    <circle cx="54" cy="9" r="0.5" fill="#F3B05C" opacity="0.6" />
  </g>
</svg>
